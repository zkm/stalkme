name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Syntax check (HTML, CSS, JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Only this repo's own files; vendored jQuery is left alone.
      - name: JavaScript parses
        run: for f in jquery.lifestream.js; do node --check "$f"; done

      # No style rules, so only CSS syntax errors fail the build.
      - name: CSS parses
        run: |
          echo '{"rules":{}}' > "$RUNNER_TEMP/stylelint.json"
          npx --yes stylelint@16 --config "$RUNNER_TEMP/stylelint.json" css/lifestream.css css/styles.css

      - name: HTML is well-formed
        run: npx --yes htmlhint@1 index.html

  pages:
    name: Build & Upload Pages artifact
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build legacy assets
        run: |
          if [ -f source/build/Makefile ]; then
            make -C source/build all || make -C source/build
          else
            echo "No legacy Makefile found; skipping build"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: pages
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
